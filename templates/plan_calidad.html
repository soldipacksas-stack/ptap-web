<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Calidad PTAP - ZFCCC</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-[#0b3d2e] text-white flex flex-col p-4 shadow-lg">
            <h1 class="text-xl font-bold border-b border-[#2c6e4b] pb-3 mb-4 text-center">PTAP ZFCCC</h1>
            <nav class="space-y-2 font-medium text-sm">
                <a href="/" class="block px-3 py-2.5 rounded bg-[#cfe9d8] text-[#0b4f2f] font-bold">Plan de Calidad</a>
                <a href="/contadores" class="block px-3 py-2.5 rounded hover:bg-[#145c38] transition">Contadores 24h</a>
                <a href="/bitacora" class="block px-3 py-2.5 rounded hover:bg-[#145c38] transition">Bitácora</a>
                <a href="/limpieza-uf" class="block px-3 py-2.5 rounded hover:bg-[#145c38] transition">Limpieza UF</a>
                <a href="/filtros" class="block px-3 py-2.5 rounded hover:bg-[#145c38] transition">Limpieza Filtros</a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-[#0b4f2f]">Control del Plan de Calidad PTAP</h2>
                <button onclick="abrirModalFormulario()" class="bg-[#17803d] hover:bg-[#0d5f2b] text-white px-4 py-2.5 rounded-lg font-semibold shadow">
                    + Registrar Plan de Calidad
                </button>
            </div>

            <!-- Panel de Filtros -->
            <div class="bg-white p-4 rounded-lg shadow mb-6 border border-gray-200">
                <h3 class="font-bold text-[#0b4f2f] mb-2">📋 Historial del Plan de Calidad</h3>
                <div class="flex flex-wrap items-center gap-4 text-sm">
                    <div>
                        <label class="block font-bold mb-1">Desde:</label>
                        <input type="date" id="f_desde" class="border rounded p-1.5 w-36">
                    </div>
                    <div>
                        <label class="block font-bold mb-1">Hasta:</label>
                        <input type="date" id="f_hasta" class="border rounded p-1.5 w-36">
                    </div>
                    <div>
                        <label class="block font-bold mb-1">Turno:</label>
                        <select id="f_turno" class="border rounded p-1.5 w-32">
                            <option value="Todos">Todos</option>
                            <option value="Turno 1">Turno 1</option>
                            <option value="Turno 2">Turno 2</option>
                            <option value="Turno 3">Turno 3</option>
                        </select>
                    </div>
                    <div class="flex items-end space-x-2 mt-5">
                        <button onclick="cargarTablaRegistros()" class="bg-[#17803d] text-white px-3 py-1.5 rounded font-semibold">Consultar</button>
                        <button onclick="establecerHoy()" class="bg-[#2d6a4f] text-white px-3 py-1.5 rounded font-semibold">Hoy</button>
                    </div>
                </div>
            </div>

            <!-- Tabla Registros -->
            <div class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden flex-1">
                <div class="overflow-x-auto max-h-[450px]">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-[#0b4f2f] text-white sticky top-0 uppercase font-semibold">
                            <tr>
                                <th class="p-3">Fecha</th>
                                <th class="p-3">Turno</th>
                                <th class="p-3">Operador</th>
                                <th class="p-3">Zona</th>
                                <th class="p-3">Parámetro</th>
                                <th class="p-3">Valor</th>
                                <th class="p-3">Resultado</th>
                            </tr>
                        </thead>
                        <tbody id="body-tabla" class="divide-y divide-gray-200">
                            <!-- Inserción dinámica de filas JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Formulario de Registro -->
    <div id="modalForm" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col">
            <div class="p-4 bg-[#0b4f2f] text-white rounded-t-xl flex justify-between items-center">
                <h3 class="text-lg font-bold">📝 Registrar Mediciones Plan de Calidad</h3>
                <button onclick="cerrarModalFormulario()" class="text-xl font-bold">&times;</button>
            </div>
            
            <div class="p-4 border-b bg-gray-50 flex flex-wrap gap-4 text-sm">
                <div>
                    <label class="block font-bold">Fecha:</label>
                    <input type="date" id="form_fecha" class="border rounded p-1" onchange="renderizarCamposDinamicos()">
                </div>
                <div>
                    <label class="block font-bold">Turno:</label>
                    <select id="form_turno" class="border rounded p-1" onchange="renderizarCamposDinamicos()">
                        <option value="Turno 1">Turno 1</option>
                        <option value="Turno 2">Turno 2</option>
                        <option value="Turno 3">Turno 3</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold">Operador:</label>
                    <select id="form_operador" class="border rounded p-1 w-64">
                        {% for op in operadores %}
                        <option value="{{ op }}" {% if 'SOLIS' in op %}selected{% endif %}>{{ op }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Campos dinámicos del Plan -->
            <div id="contenedor-parametros" class="p-6 overflow-y-auto space-y-6 flex-1">
                <!-- Se llena mediante JS según fecha y turno -->
            </div>

            <div class="p-4 border-t bg-gray-50 flex justify-end space-x-3">
                <button onclick="cerrarModalFormulario()" class="px-4 py-2 bg-gray-400 text-white rounded font-bold">Cancelar</button>
                <button onclick="enviarFormulario()" class="px-5 py-2 bg-[#17803d] hover:bg-[#0d5f2b] text-white rounded font-bold">Guardar Mediciones</button>
            </div>
        </div>
    </div>

    <script>
        const hoyStr = new Date().toISOString().split('T')[0];

        document.getElementById('f_desde').value = hoyStr;
        document.getElementById('f_hasta').value = hoyStr;
        document.getElementById('form_fecha').value = hoyStr;

        function establecerHoy() {
            document.getElementById('f_desde').value = hoyStr;
            document.getElementById('f_hasta').value = hoyStr;
            cargarTablaRegistros();
        }

        async function cargarTablaRegistros() {
            const desde = document.getElementById('f_desde').value;
            const hasta = document.getElementById('f_hasta').value;
            const turno = document.getElementById('f_turno').value;

            const res = await fetch(`/api/plan-calidad/registros?f_desde=${desde}&f_hasta=${hasta}&turno=${turno}`);
            const data = await res.json();

            const tbody = document.getElementById('body-tabla');
            tbody.innerHTML = '';

            if (data.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="p-4 text-center text-gray-500 italic">No hay registros para este filtro.</td></tr>';
                return;
            }

            data.data.forEach(item => {
                const esFuera = item.resultado === "FUERA DE RANGO";
                const row = `
                    <tr class="${esFuera ? 'bg-red-50 text-red-700 font-semibold' : 'hover:bg-gray-50'}">
                        <td class="p-3 border-b">${item.fecha}</td>
                        <td class="p-3 border-b">${item.turno}</td>
                        <td class="p-3 border-b">${item.operador}</td>
                        <td class="p-3 border-b">${item.zona}</td>
                        <td class="p-3 border-b">${item.parametro}</td>
                        <td class="p-3 border-b font-mono">${item.valor}</td>
                        <td class="p-3 border-b">${item.resultado}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function abrirModalFormulario() {
            document.getElementById('modalForm').classList.remove('hidden');
            document.getElementById('modalForm').classList.add('flex');
            document.getElementById('form_fecha').value = hoyStr;
            renderizarCamposDinamicos();
        }

        function cerrarModalFormulario() {
            document.getElementById('modalForm').classList.add('hidden');
            document.getElementById('modalForm').classList.remove('flex');
        }

        async function renderizarCamposDinamicos() {
            const fechaVal = document.getElementById('form_fecha').value;
            const turnoSel = document.getElementById('form_turno').value;
            const contenedor = document.getElementById('contenedor-parametros');
            contenedor.innerHTML = '<p class="text-sm text-gray-500 italic text-center py-4">Cargando parámetros para la fecha y turno seleccionados...</p>';

            try {
                const res = await fetch(`/api/plan-calidad/maestra?fecha=${fechaVal}&turno=${turnoSel}`);
                const data = await res.json();
                
                contenedor.innerHTML = '';

                if (!data.maestra || data.maestra.length === 0) {
                    contenedor.innerHTML = '<p class="text-sm text-gray-500 italic text-center py-4">No hay parámetros obligatorios para registrar en esta fecha y turno.</p>';
                    return;
                }

                const zonas = {};
                data.maestra.forEach(([zona, param, freq, reqTurno, limite]) => {
                    if (!zonas[zona]) zonas[zona] = [];
                    zonas[zona].push({ param, limite });
                });

                for (const [zona, items] of Object.entries(zonas)) {
                    let card = `
                        <div class="bg-gray-50 border rounded-lg p-4">
                            <h4 class="font-bold text-[#0b4f2f] mb-3 border-b pb-1">📍 ${zona.toUpperCase()}</h4>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    `;
                    items.forEach(item => {
                        const esSensorial = item.param.toLowerCase().includes("sensorial");
                        let inputHtml = esSensorial ? 
                            `<select data-zona="${zona}" data-param="${item.param}" data-limite="${item.limite}" class="input-medida border rounded p-1 text-sm w-full">
                                <option value="Pasa">Pasa</option>
                                <option value="No pasa">No pasa</option>
                            </select>` :
                            `<input type="text" data-zona="${zona}" data-param="${item.param}" data-limite="${item.limite}" placeholder="${item.limite}" class="input-medida border rounded p-1 text-sm w-full">`;

                        card += `
                            <div class="flex flex-col">
                                <label class="text-xs font-semibold text-gray-700">${item.param}</label>
                                <div class="flex items-center space-x-2 mt-1">
                                    ${inputHtml}
                                    <span class="text-[10px] text-gray-500 italic whitespace-nowrap">Límite: ${item.limite}</span>
                                </div>
                            </div>
                        `;
                    });
                    card += `</div></div>`;
                    contenedor.innerHTML += card;
                }
            } catch (err) {
                console.error("Error al cargar la maestra filtrada:", err);
                contenedor.innerHTML = '<p class="text-sm text-red-500 text-center py-4">Error al cargar los parámetros del plan de calidad.</p>';
            }
        }

        async function enviarFormulario() {
            const inputs = document.querySelectorAll('.input-medida');
            const registros = [];

            inputs.forEach(inp => {
                const val = inp.value.trim();
                if (val) {
                    registros.push({
                        zona: inp.dataset.zona,
                        parametro: inp.dataset.param,
                        valor: val,
                        limite: inp.dataset.limite
                    });
                }
            });

            if (registros.length === 0) {
                alert("Por favor ingrese al menos un valor de medición.");
                return;
            }

            const payload = {
                fecha: document.getElementById('form_fecha').value,
                turno: document.getElementById('form_turno').value,
                operador: document.getElementById('form_operador').value,
                registros: registros
            };

            const response = await fetch('/api/plan-calidad/guardar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                alert("¡Mediciones registradas correctamente!");
                cerrarModalFormulario();
                cargarTablaRegistros();
            } else {
                alert("Ocurrió un error al guardar los datos.");
            }
        }

        cargarTablaRegistros();
    </script>
</body>
</html>
